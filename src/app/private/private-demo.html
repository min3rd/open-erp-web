<section class="h-screen bg-surface-100">
  <app-layout
    [layoutType]="layoutType()"
    [permissions]="userPermissions"
    contentTitle="Hộp thư nội bộ"
  >
    <div class="space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p class="text-lg font-semibold">Private layout demo</p>
          <p class="text-sm text-surface-500">
            Chuyển đổi horizontal/vertical và thử menu, chat, tab bar.
          </p>
        </div>
        <div class="flex gap-2">
          <p-button
            label="Vertical"
            icon="pi pi-arrows-v"
            size="small"
            [severity]="layoutType() === 'vertical' ? 'primary' : 'secondary'"
            (onClick)="setLayout('vertical')"
            aria-label="Chuyển sang vertical layout"
          />
          <p-button
            label="Horizontal"
            icon="pi pi-arrows-h"
            size="small"
            [severity]="layoutType() === 'horizontal' ? 'primary' : 'secondary'"
            (onClick)="setLayout('horizontal')"
            aria-label="Chuyển sang horizontal layout"
          />
        </div>
      </div>

      <div class="rounded-xl border border-surface-200 overflow-hidden">
        <div class="flex items-center justify-between px-4 py-2 bg-surface-50 border-b border-surface-200">
          <div class="flex items-center gap-2 text-sm text-surface-600">
            <p-checkbox [binary]="true" inputId="all" />
            <span>Chọn tất cả</span>
          </div>
          <div class="flex items-center gap-2 text-surface-500">
            <i class="pi pi-search"></i>
            <i class="pi pi-filter"></i>
            <i class="pi pi-sort-alt"></i>
          </div>
        </div>

        <div class="divide-y divide-surface-200" role="list">
          @for (mail of mails(); track mail.id) {
            <article
              class="flex items-center gap-3 px-4 py-3 hover:bg-surface-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-400"
              role="listitem"
              tabindex="0"
            >
              <p-checkbox [binary]="true" inputId="mail-{{ mail.id }}" />
              <div class="w-10 h-10 rounded-full overflow-hidden border border-surface-200">
                <img
                  ngSrc="{{ mail.avatar }}"
                  width="40"
                  height="40"
                  alt="Ảnh đại diện của {{ mail.sender }}"
                  class="w-full h-full object-cover"
                />
              </div>
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <p class="text-sm font-semibold text-surface-900 truncate">
                    {{ mail.sender }}
                  </p>
                  @if (mail.unread) {
                    <span class="w-2 h-2 rounded-full bg-primary-500 inline-block"></span>
                  }
                </div>
                <p class="text-sm text-surface-700 truncate">{{ mail.subject }}</p>
                <p class="text-xs text-surface-500 truncate">{{ mail.preview }}</p>
              </div>
              <p-tag [value]="mail.label" [severity]="mail.severity" />
              <span class="text-xs text-surface-500 whitespace-nowrap">{{ mail.time }}</span>
            </article>
          } @empty {
            <p class="text-sm text-center text-surface-500 px-4 py-6">
              Không có thư để hiển thị
            </p>
          }
        </div>
      </div>
    </div>
  </app-layout>
</section>
