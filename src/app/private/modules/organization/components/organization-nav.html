<nav
  id="organization-nav"
  class="flex flex-col h-full bg-surface-0 dark:bg-surface-900 border-r border-surface-200 dark:border-surface-700 transition-all duration-300"
  [class.w-14]="navMode() === 'narrow'"
  [class.w-64]="navMode() === 'sidebar'"
  role="navigation"
  [attr.aria-label]="'organization.title' | transloco"
>
  <!-- Header with toggle -->
  <div
    id="organization-nav-header"
    class="flex items-center justify-between p-3 border-b border-surface-200 dark:border-surface-700"
    [class.justify-center]="navMode() === 'narrow'"
  >
    @if (navMode() === 'sidebar') {
    <h2 id="organization-nav-title" class="text-lg font-semibold text-surface-900 dark:text-surface-0">
      {{ 'organization.title' | transloco }}
    </h2>
    }
    <p-button
      id="organization-nav-toggle"
      (onClick)="onToggleNavMode()"
      [icon]="navMode() === 'narrow' ? 'pi pi-angle-right' : 'pi pi-angle-left'"
      [text]="true"
      [rounded]="true"
      severity="secondary"
      size="small"
      [pTooltip]="'organization.navigation.toggleNavMode' | transloco"
      tooltipPosition="right"
      [showDelay]="500"
      [attr.aria-label]="'organization.navigation.toggleNavMode' | transloco"
      [attr.aria-expanded]="navMode() === 'sidebar'"
    />
  </div>

  <!-- Navigation items -->
  <div id="organization-nav-items" class="flex-1 overflow-y-auto py-2">
    <ul class="space-y-1 px-2" role="list">
      <!-- Register Organization -->
      <li id="organization-nav-item-register">
        <a
          id="organization-nav-link-register"
          routerLink="new"
          routerLinkActive="bg-primary-100 dark:bg-primary-900/20 text-primary-700 dark:text-primary-300"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors text-surface-700 dark:text-surface-300"
          [class.justify-center]="navMode() === 'narrow'"
          [pTooltip]="navMode() === 'narrow' ? ('organization.navigation.register' | transloco) : ''"
          tooltipPosition="right"
          [showDelay]="500"
          [attr.aria-label]="'organization.navigation.register' | transloco"
        >
          <i class="pi pi-building text-xl" aria-hidden="true"></i>
          @if (navMode() === 'sidebar') {
          <span class="text-sm font-medium">{{ 'organization.navigation.register' | transloco }}</span>
          }
        </a>
      </li>

      <!-- View Information -->
      <li id="organization-nav-item-detail">
        <a
          id="organization-nav-link-detail"
          routerLink="demo-org-id"
          routerLinkActive="bg-primary-100 dark:bg-primary-900/20 text-primary-700 dark:text-primary-300"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors text-surface-700 dark:text-surface-300"
          [class.justify-center]="navMode() === 'narrow'"
          [pTooltip]="navMode() === 'narrow' ? ('organization.navigation.detail' | transloco) : ''"
          tooltipPosition="right"
          [showDelay]="500"
          [attr.aria-label]="'organization.navigation.detail' | transloco"
        >
          <i class="pi pi-info-circle text-xl" aria-hidden="true"></i>
          @if (navMode() === 'sidebar') {
          <span class="text-sm font-medium">{{ 'organization.navigation.detail' | transloco }}</span>
          }
        </a>
      </li>
    </ul>
  </div>
</nav>
