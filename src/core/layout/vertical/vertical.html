<!-- Desktop Layout -->
<div class="hidden md:flex h-screen overflow-hidden bg-surface-0 dark:bg-surface-900">
  <!-- Side Menu -->
  <aside
    [class]="menuWidth() + ' transition-all duration-300 ease-in-out border-r border-surface-border'"
    [attr.aria-label]="'Main navigation'"
  >
    <app-side-menu
      [items]="menuData()"
      [collapsed]="menuCollapsed()"
      (onToggle)="toggleMenu()"
    />
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <div class="flex-1 overflow-y-auto bg-surface-ground">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Chat Panel -->
  @if (chatState().isOpen) {
    <aside
      class="w-80 transition-all duration-300 ease-in-out border-l border-surface-border"
      [attr.aria-label]="'Chat panel'"
    >
      <ng-container #chatContainer></ng-container>
    </aside>
  }

  <!-- Floating Chat Toggle Button (only when chat is closed) -->
  @if (!chatState().isOpen) {
    <button
      pButton
      type="button"
      icon="pi pi-comments"
      class="p-button-rounded fixed bottom-6 right-6 z-50"
      (click)="toggleChat()"
      [attr.aria-label]="'Open chat'"
    ></button>
  }
</div>

<!-- Mobile Layout -->
<div class="md:hidden flex flex-col h-screen overflow-hidden bg-surface-0 dark:bg-surface-900">
  <!-- Content Area -->
  <main class="flex-1 overflow-y-auto bg-surface-ground">
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Tab Bar -->
  <nav
    class="border-t border-surface-border bg-surface-0 dark:bg-surface-900"
    role="navigation"
    [attr.aria-label]="'Mobile navigation'"
  >
    <div class="flex items-center justify-around py-2">
      <button
        type="button"
        class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition-colors hover:bg-surface-100 dark:hover:bg-surface-800"
        (click)="toggleMobileMenu()"
        [attr.aria-label]="'Open menu'"
      >
        <i class="pi pi-th-large text-xl"></i>
        <span class="text-xs">Menu</span>
      </button>

      <button
        type="button"
        class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition-colors bg-primary-50 dark:bg-primary-900/20"
        [attr.aria-label]="'Content'"
        [attr.aria-current]="'page'"
      >
        <i class="pi pi-home text-xl text-primary-500"></i>
        <span class="text-xs text-primary-500">Content</span>
      </button>

      <button
        type="button"
        class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition-colors hover:bg-surface-100 dark:hover:bg-surface-800"
        (click)="toggleChat()"
        [attr.aria-label]="'Open chat'"
      >
        <i class="pi pi-comments text-xl"></i>
        <span class="text-xs">Chat</span>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu Dialog -->
  <app-mobile-menu
    [items]="menuData()"
    [visible]="mobileMenuOpen()"
    (onClose)="closeMobileMenu()"
  />

  <!-- Mobile Chat Dialog -->
  @if (chatState().isOpen) {
    <div
      class="fixed inset-0 z-50 bg-surface-0 dark:bg-surface-900"
      role="dialog"
      [attr.aria-label]="'Chat'"
    >
      <ng-container #chatContainer></ng-container>
    </div>
  }
</div>
