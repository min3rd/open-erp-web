<!-- Desktop Layout -->
<div class="hidden md:flex flex-col h-screen overflow-hidden">
  <!-- Top Menu (Sticky) -->
  <header class="sticky top-0 z-40" role="banner">
    <app-top-menu [items]="menuData()" />
  </header>

  <!-- Content and Chat Area -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto bg-surface-50 dark:bg-surface-950">
      <router-outlet></router-outlet>
    </main>

    <!-- Chat Panel -->
    @if (chatState().isOpen) {
      <aside
        class="w-80 transition-all duration-300 ease-in-out border-l border-surface-200 dark:border-surface-700"
        [attr.aria-label]="'Chat panel'"
      >
        <ng-container #chatContainer></ng-container>
      </aside>
    }
  </div>

  <!-- Floating Chat Toggle Button -->
  @if (!chatState().isOpen) {
    <button
      pButton
      type="button"
      icon="pi pi-comments"
      class="p-button-rounded fixed bottom-4 right-4 z-50 shadow-lg"
      (click)="toggleChat()"
      [attr.aria-label]="'Open chat'"
    ></button>
  }
</div>

<!-- Mobile Layout -->
<div class="md:hidden flex flex-col h-screen overflow-hidden">
  <!-- Content Area -->
  <main class="flex-1 overflow-y-auto bg-surface-50 dark:bg-surface-950">
    <router-outlet></router-outlet>
  </main>

  <!-- Bottom Tab Bar -->
  <nav
    class="border-t border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900"
    role="navigation"
    [attr.aria-label]="'Mobile navigation'"
  >
    <div class="flex items-center justify-around py-2">
      <button
        type="button"
        class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition-colors hover:bg-surface-100 dark:hover:bg-surface-800"
        (click)="toggleMobileMenu()"
        [attr.aria-label]="'Open menu'"
      >
        <i class="pi pi-th-large text-xl"></i>
        <span class="text-xs">Menu</span>
      </button>

      <button
        type="button"
        class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition-colors bg-primary-50 dark:bg-primary-900/20"
        [attr.aria-label]="'Content'"
        [attr.aria-current]="'page'"
      >
        <i class="pi pi-home text-xl text-primary-500"></i>
        <span class="text-xs text-primary-500">Content</span>
      </button>

      <button
        type="button"
        class="flex flex-col items-center gap-1 px-4 py-2 rounded-lg transition-colors hover:bg-surface-100 dark:hover:bg-surface-800"
        (click)="toggleChat()"
        [attr.aria-label]="'Open chat'"
      >
        <i class="pi pi-comments text-xl"></i>
        <span class="text-xs">Chat</span>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu Dialog -->
  <app-mobile-menu
    [items]="menuData()"
    [visible]="mobileMenuOpen()"
    (onClose)="closeMobileMenu()"
  />

  <!-- Mobile Chat Dialog -->
  @if (chatState().isOpen) {
    <div
      class="fixed inset-0 z-50 bg-surface-0 dark:bg-surface-900"
      role="dialog"
      [attr.aria-label]="'Chat'"
    >
      <ng-container #chatContainer></ng-container>
    </div>
  }
</div>
