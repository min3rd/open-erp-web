<div class="h-screen flex flex-col overflow-hidden bg-surface-50 text-surface-900">
  <header class="sticky top-0 z-20 bg-surface-0 border-b border-surface-200">
    @if (menuLoading()) {
      <div class="px-4 py-3">
        <p-skeleton height="2.5rem" class="mb-2" />
        <p-skeleton height="2.5rem" />
      </div>
    } @else {
      <p-menubar
        [model]="menuItems()"
        [autoDisplay]="false"
        styleClass="bg-surface-0 border-0 shadow-none px-4"
      >
        <ng-template pTemplate="start">
          <div class="flex items-center gap-2 mr-4">
            <div class="w-10 h-10 rounded-2xl bg-primary-100 text-primary-600 flex items-center justify-center font-semibold">
              OE
            </div>
            <div class="hidden sm:block">
              <p class="text-sm font-semibold leading-tight">Open ERP</p>
              <p class="text-xs text-surface-500 leading-tight">Horizontal layout</p>
            </div>
          </div>
        </ng-template>
        <ng-template pTemplate="end">
          <div class="flex items-center gap-2">
            <p-button
              icon="pi pi-refresh"
              [rounded]="true"
              [text]="true"
              size="small"
              aria-label="Làm mới menu"
              (onClick)="refreshMenu.emit()"
            />
            <p-button
              icon="pi pi-comments"
              [rounded]="true"
              [text]="true"
              aria-label="Mở chat"
              (onClick)="toggleChat.emit()"
            />
            <p-avatar
              image="https://i.pravatar.cc/60?img=11"
              shape="circle"
              size="large"
              aria-label="Tài khoản"
            />
          </div>
        </ng-template>
      </p-menubar>
    }
  </header>

  <div class="flex flex-1 overflow-hidden">
    <main class="flex-1 overflow-hidden">
      <div class="h-full overflow-y-auto p-4">
        <div
          class="h-full min-h-full rounded-2xl bg-surface-0 shadow-sm border border-surface-200 p-4 pb-20 md:pb-4"
          aria-label="Khu vực nội dung"
        >
          <div class="flex items-center justify-between mb-4">
            <div>
              <p class="text-lg font-semibold">{{ contentTitle() }}</p>
              <p class="text-sm text-surface-500">Menu top sticky, nội dung cuộn trong khu vực</p>
            </div>
            <p-badge value="Private" severity="info" />
          </div>
          <ng-content />
        </div>
      </div>
    </main>

    <aside
      class="hidden lg:flex flex-col border-l border-surface-200 bg-surface-0 transition-all duration-200"
      [class.w-80]="chatOpen()"
      [class.w-14]="!chatOpen()"
      aria-label="Bảng chat"
    >
      <div class="flex items-center justify-between px-3 py-3">
        <p class="text-sm font-semibold">Chat</p>
        <p-button
          icon="pi pi-times"
          [rounded]="true"
          [text]="true"
          size="small"
          aria-label="Đóng chat"
          (onClick)="toggleChat.emit()"
        />
      </div>
      @if (chatOpen()) {
        <div class="flex-1 overflow-hidden">
          @defer (when chatOpen()) {
            <private-chat-panel />
          } @placeholder {
            <div class="h-full flex items-center justify-center text-surface-500">
              Đang tải chat...
            </div>
          }
        </div>
      } @else {
        <div class="flex items-center justify-center flex-1">
          <p-button
            label="Mở chat"
            icon="pi pi-comments"
            severity="secondary"
            (onClick)="toggleChat.emit()"
          />
        </div>
      }
    </aside>
  </div>
</div>
