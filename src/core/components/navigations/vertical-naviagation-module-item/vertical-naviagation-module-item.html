<div
  pRipple
  [pTooltip]="label()"
  tooltipPosition="right"
  class="nav-item"
  [class.active]="isActive()"
  role="button"
  tabindex="0"
  [attr.aria-label]="label()"
>
  @if (icon()) {
  <span [class]="icon() + ' nav-item-icon'"></span>
  }

  <span class="nav-item-label">
    {{ label() }}
  </span>
</div>
