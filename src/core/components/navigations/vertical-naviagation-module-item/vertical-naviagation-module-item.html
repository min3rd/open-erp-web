<div
  pRipple
  [pTooltip]="label"
  class="flex flex-auto flex-col mx-auto w-16 h-16 p-2 justify-center text-center rounded-md border border-neutral-200 dark:border-neutral-800 cursor-pointer hover:bg-primary-300 hover:text-white hover:dark:text-gray-950 select-none animate-fade-right animate-duration-300"
>
  @if (icon) {
  <span [class]="icon"></span>
  }

  <span class="text-xs truncate">
    {{ label }}
  </span>
</div>
