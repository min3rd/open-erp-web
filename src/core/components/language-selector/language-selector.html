<div id="language-selector-container" class="w-full p-2">
  <label
    for="language-selector-dropdown"
    class="block text-xs font-medium text-surface-600 dark:text-surface-400 mb-1"
  >
    {{ 'languageSelector.label' | transloco }}
  </label>
  <p-select
    id="language-selector-dropdown"
    [options]="languages"
    [(ngModel)]="selectedLanguage"
    optionLabel="label"
    optionValue="code"
    [placeholder]="'languageSelector.placeholder' | transloco"
    styleClass="w-full"
    [attr.aria-label]="'languageSelector.ariaLabel' | transloco"
  >
    <ng-template let-lang pTemplate="item">
      <div class="flex items-center gap-2 py-1" [attr.id]="'language-selector-option-' + lang.code">
        <span class="text-2xl" aria-hidden="true">{{ lang.flag }}</span>
        <span class="font-medium">{{ lang.label }}</span>
      </div>
    </ng-template>

    <ng-template let-lang pTemplate="selectedItem">
      <div class="flex items-center gap-2" id="language-selector-selected">
        <span class="text-xl" aria-hidden="true">{{ lang.flag }}</span>
        <span class="font-medium text-sm">{{ lang.label }}</span>
      </div>
    </ng-template>
  </p-select>
</div>
