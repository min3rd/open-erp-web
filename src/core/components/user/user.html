<div class="flex flex-auto mx-auto justify-center select-none">
  @if(!user){
  <p-skeleton shape="square" size="2rem" />
  } @else { @if(user.avatarUrl){
  <p-avatar
    pRipple
    [pTooltip]="user.fullName"
    [image]="user.avatarUrl"
    size="large"
    shape="square"
  />
  } @else {
  <p-avatar
    pRipple
    [pTooltip]="user.fullName"
    [label]="user.fullName.charAt(0)"
    size="large"
    shape="square"
  />
  } }
</div>
